# SonarQube Cloud configuration.
#
# The token lives in the GitHub secret SONAR_TOKEN and is NEVER in this file.
# Everything here is public information: the project key and organization are
# visible in the SonarCloud URL.

sonar.projectKey=rkhnania_harbourline-k8s-lab
sonar.organization=rkhnania

# Analyse the whole repository, not just the Python services: SonarCloud has
# rules for GitHub Actions workflows, Dockerfiles, shell scripts and Kubernetes
# YAML, and those are where the real findings turned out to be.
sonar.sources=.

# Test code is analysed under different rules than production code - a hardcoded
# password in a fixture is not the same finding as one in an application. Sonar
# refuses to index a file twice, so test directories must also be excluded from
# sonar.sources above.
sonar.tests=api/tests,reports/tests
sonar.exclusions=api/tests/**,reports/tests/**,**/__pycache__/**,**/.pytest_cache/**

sonar.python.version=3.12

# Coverage comes from the test job's artefacts. Each file is produced by pytest
# running inside its own service directory, so the paths inside the XML are
# resolved relative to the <sources> element the tool writes - worth checking in
# the UI after the first run rather than assuming it resolved.
sonar.python.coverage.reportPaths=api/coverage.xml,reports/coverage.xml
