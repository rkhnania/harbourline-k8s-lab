{{- /*
One ServiceAccount per service, even though none of these services call the
Kubernetes API and none of them is granted a single permission.

WHY BOTHER, IF IT GRANTS NOTHING
Because you cannot scope `default`. Every pod in a namespace that does not name
a ServiceAccount runs as `default`, so the day anyone binds a Role to `default`
for convenience - and that is the path of least resistance when one deployment
needs to read a ConfigMap - every pod in the namespace silently inherits it,
this database included, plus anything added later. A named ServiceAccount is a
subject you can scope, bind to, audit and revoke. An unnamed one is a shared
account.

automountServiceAccountToken: false
Pods were carrying a signed, auto-rotating API credential at
/var/run/secrets/kubernetes.io/serviceaccount/token, readable by the app's own
uid, for workloads that never speak to the API. That is a credential standing
between a code-execution bug and the cluster, issued for nothing.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.name }}
  labels:
    app.kubernetes.io/part-of: {{ .Values.partOf }}
automountServiceAccountToken: false
