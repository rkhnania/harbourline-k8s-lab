apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  labels:
    app.kubernetes.io/part-of: {{ .Values.partOf }}
    {{- with .Values.extraLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if not .Values.hpa }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ .Values.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
        app.kubernetes.io/part-of: {{ .Values.partOf }}
    spec:
      {{- with .Values.terminationGracePeriodSeconds }}
      # How long a terminating pod has before SIGKILL. The 30s default is fine
      # for request/response work - in-flight requests finish in milliseconds.
      # A tier holding long-lived connections is the case where it matters:
      # this is the window in which a scanner finishes what it is doing before
      # the pod goes.
      #
      # It does not SAVE the session. Nothing does. It decides whether the
      # operator completes the pick they are on or loses it mid-scan.
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      # Named, per-service subject - never `default`, which cannot be scoped to
      # one workload.
      serviceAccountName: {{ .Values.name }}
      # Set here AND on the ServiceAccount deliberately. The pod-level setting
      # overrides the ServiceAccount's, so this one is what actually takes
      # effect; the ServiceAccount's protects any future pod that uses it
      # without saying so. Either alone leaves a gap.
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecret }}
      # Optional since 2026-11-08. The GHCR packages are public, so nothing
      # here needs a registry credential - which removed a secret rather than
      # sealing one. Kept as a value because a private registry is the normal
      # enterprise case and this is the hook for it.
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      {{- if .Values.spread.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.spread.maxSkew }}
          topologyKey: {{ .Values.spread.topologyKey }}
          whenUnsatisfiable: {{ .Values.spread.whenUnsatisfiable }}
          nodeTaintsPolicy: Honor
          nodeAffinityPolicy: Honor
          labelSelector:
            matchLabels:
              app: {{ .Values.name }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Values.containerName }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: {{ .Values.containerPort }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
