# Defaults shared by every Harbourline service.
# Per-service files override only what differs.

name: harbourline-app
containerName: app
partOf: harbourline
replicaCount: 2

image:
  repository: harbourline/app
  tag: latest

# No registry credential. All three GHCR packages were made public on
# 2026-11-08, which closed two rebuild-test gaps at once: the hand-made
# ghcr-pull secret, and harbourline-api's package visibility differing from
# its siblings - web pulled and ran on the rebuilt cluster while api did not.
#
# Set this to a Secret name to use a private registry instead.
imagePullSecret: ""
containerPort: 8080
configMapName: harbourline-config
probePath: /health

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

env: []

service:
  port: 8080
  # nodePort, protocol and sessionAffinity are unset by default. Only Plimsoll
  # Deck needs the first two, and only because it is not HTTP.

envFrom:
  - configMapRef:
      name: harbourline-config

readinessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 3
  periodSeconds: 5

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 10

volumes:
  - name: tmp
    emptyDir: {}

volumeMounts:
  - name: tmp
    mountPath: /tmp

spread:
  enabled: true
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: DoNotSchedule

pdb:
  maxUnavailable: 1

# Post-deployment smoke test (templates/smoke-test-job.yaml). OFF by default:
# all three Applications sync on every deploy, so it is enabled for exactly one
# of them - web - in values-web.yaml. See the template for the reasoning.
smokeTest:
  enabled: false
