# Defaults shared by every Harbourline service.
# Per-service files override only what differs.

name: harbourline-app
containerName: app
partOf: harbourline
replicaCount: 2

image:
  repository: harbourline/app
  tag: latest

imagePullSecret: ghcr-pull
containerPort: 8080
configMapName: harbourline-config
probePath: /health

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

env: []

service:
  port: 8080

envFrom:
  - configMapRef:
      name: harbourline-config

readinessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 3
  periodSeconds: 5

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 10

volumes:
  - name: tmp
    emptyDir: {}

volumeMounts:
  - name: tmp
    mountPath: /tmp
