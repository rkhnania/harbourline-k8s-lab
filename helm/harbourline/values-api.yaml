name: harbourline-api
extraLabels:
  app: harbourline-api
containerName: api
replicaCount: 3

image:
  repository: ghcr.io/rkhnania/harbourline-api
  tag: "7d66df1"

envFrom:
  - configMapRef:
      name: harbourline-config
  - secretRef:
      name: harbourline-db-secret

env:
  - name: PYTHONDONTWRITEBYTECODE
    value: "1"

readinessProbe:
  httpGet:
    path: /health
    port: 8080
  periodSeconds: 5
  failureThreshold: 2
  initialDelaySeconds: 0

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  periodSeconds: 10
  failureThreshold: 3
  initialDelaySeconds: 0

startupProbe:
  httpGet:
    path: /health
    port: 8080
  periodSeconds: 3
  failureThreshold: 20

# NO session affinity, deliberately - this is the MOCA-equivalent tier and the
# Blue Yonder diagram marks it non-sticky.
#
# Measured on 2026-11-14 with sessionAffinity: ClientIP set here. Ten requests
# reached exactly two of three api pods, 5 and 5, and the third received
# nothing. The api Service never sees a user; it sees nginx in the web pod, and
# there are two web pods. ClientIP pinned per PROXY, not per user - and
# stranded a third of the capacity while doing it.
#
# Session affinity belongs at the ingress, keyed on a cookie. See
# k8s/platform/harbourline-ingress.yaml.
