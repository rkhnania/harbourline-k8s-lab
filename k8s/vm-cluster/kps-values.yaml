# kube-prometheus-stack values for the Harbourline VM cluster (kubeadm, 3 nodes).
#
# Install:
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm install kps prometheus-community/kube-prometheus-stack \
#     -n monitoring --create-namespace \
#     -f k8s/vm-cluster/kps-values.yaml \
#     --set grafana.adminPassword='<password>' \
#     --timeout 10m
#
# The admin password is deliberately NOT in this file - pass it with --set,
# or move it to a Secret once External Secrets Operator is in place.

grafana:
  # DISABLED 2026-10-16. There is ONE Grafana for this project and it runs on the
  # kind cluster at http://grafana.localtest.me, reading THIS cluster's Prometheus
  # as a second datasource (k8s/monitoring/vm-cluster-datasource.yaml).
  #
  # A second Grafana here showed the same data to the same person and cost a 5Gi
  # PVC - 10Gi of the 78Gi Longhorn pool, because longhorn-2 keeps 2 replicas -
  # plus one of the eleven MetalLB addresses.
  #
  # Trade-off, accepted knowingly: with the kind cluster stopped there is no
  # dashboard UI for this cluster. Prometheus here keeps scraping and retaining
  # regardless, so no data is lost - only the view. `kubectl top` and
  # http://prometheus.hl.internal still answer.
  enabled: false

prometheus:
  prometheusSpec:
    retention: 7d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn-2
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              # longhorn-2 keeps 2 replicas, so this consumes 20Gi of the 78Gi pool.
              storage: 10Gi

alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn-2
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi
