# Longhorn StorageClass with 2 replicas.
# The cluster has 2 schedulable storage nodes (hl-w1, hl-w2) because the
# control plane is tainted. Longhorn's default class asks for 3 replicas,
# which would leave every volume permanently Degraded.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-2
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "2"
  staleReplicaTimeout: "30"
  fsType: ext4
