# kube-prometheus-stack - Prometheus, Alertmanager, Grafana, node-exporter,
# kube-state-metrics and the Prometheus Operator.
#
# BROWNFIELD ADOPTION. This release already exists, installed by hand with
# `helm install` on 2026-09-27. Argo CD is taking over something that is
# running and serving, which is the hard direction.
#
# ADOPTED AND VERIFIED on 2026-11-07. Synced by hand first, with automation
# off, so the diff could be read before anything moved. Grafana came back
# serving and reading its password from the SealedSecret.
#
# One thing the sync did NOT do, and it is worth knowing: Grafana keeps the
# admin user in its own database, on a PVC that has survived since September.
# GF_SECURITY_ADMIN_PASSWORD seeds that user at first initialisation and does
# not rewrite an existing one, so pointing the chart at a new Secret changed
# the environment variable and not the password. The fix is
# `grafana cli admin reset-admin-password` inside the pod - see
# k8s/monitoring/README.md.
#
# prune stays OFF. Grafana's PVC is chart-templated, and a prune that stops
# seeing one deletes it - which is how a Grafana PVC was lost on 2026-10-16.
#
# releaseName: kps is load-bearing. Argo CD names rendered resources after the
# release; without it they would be named after this Application and Argo
# would create a parallel set of objects beside the live ones rather than
# adopting them.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kps
  namespace: argocd
spec:
  project: default

  # Two sources: the chart from upstream, the values from this repository.
  # $values resolves to the source carrying `ref: values`.
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 91.7.0 # matches the live release exactly - adopt first, upgrade later
      helm:
        releaseName: kps
        valueFiles:
          - $values/k8s/monitoring/kps-values.yaml
    - repoURL: https://github.com/rkhnania/harbourline-k8s-lab.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      # kube-prometheus-stack's CRDs are enormous. A client-side apply stores
      # the whole previous object in the last-applied-configuration
      # annotation, which exceeds Kubernetes' 262144-byte annotation limit and
      # fails with "Too long". Server-side apply does not use that annotation.
      # This is the single most common reason this chart fails under Argo CD.
      - ServerSideApply=true
      - CreateNamespace=true
