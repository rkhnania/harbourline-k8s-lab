# Sealed Secrets controller.
#
# WHY THIS EXISTS
# Three secrets are the reason this project cannot be rebuilt from Git: the
# GHCR pull secret, the database password and the TLS certificate - see
# docs/rebuild-test.md. A fourth surfaced on 2026-11-07: the Grafana admin
# password, which lives only in the kube-prometheus-stack Helm release and was
# passed with --set at install time. GitOps has no install time, so adopting
# that release is impossible until the password has somewhere to live.
#
# Sealed Secrets lets the ENCRYPTED secret live in Git. The controller holds a
# private key in the cluster; kubeseal encrypts with the matching public key;
# only this cluster can decrypt. The ciphertext is safe to commit and safe to
# make public.
#
# WHAT IT DOES NOT SOLVE, STATED UP FRONT
# It does not remove the unreproducible thing - it reduces four of them to one.
# The sealing key is generated inside the cluster, so destroying the cluster
# destroys the ability to decrypt everything sealed for it. The key must be
# backed up OUTSIDE the cluster or the rebuild test still fails, just later and
# more confusingly. See docs/secrets.md.
#
# THE CONTROLLER ITSELF HOLDS NO SECRET INPUT, so unlike everything it protects
# it can go under GitOps immediately, with nothing to bootstrap.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
spec:
  project: default
  source:
    # An upstream chart repository, not this repo. The chart moved from
    # bitnami-labs to bitnami during 2025; the old GitHub Pages URL that every
    # tutorial still prints now returns 404.
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.22.0 # controller v0.41.2 - must match the kubeseal CLI
    helm:
      releaseName: sealed-secrets
      valuesObject:
        # kubeseal looks for a controller called `sealed-secrets-controller` in
        # kube-system unless told otherwise. The chart would name it
        # `sealed-secrets`, which makes every kubeseal invocation need
        # --controller-name. Matching the default is one less thing to remember
        # wrong at the moment you are trying to seal something.
        fullnameOverride: sealed-secrets-controller
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
