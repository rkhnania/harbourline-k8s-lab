apiVersion: batch/v1
kind: Job
metadata:
  name: harbourline-migrate-001
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      # postgres:16-alpine runs psql as uid 70 (the postgres user in that image).
      # Added 2026-10-20 after Trivy KSV-0118/0012/0104: these two workloads
      # predate the hardening applied to the Deployments and were never
      # revisited, so they were running with the default security context.
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: postgres:16-alpine
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: harbourline-db-secret
                  key: DB_PASSWORD
          command:
            - sh
            - -c
            - |
              psql -h harbourline-db -U postgres -v ON_ERROR_STOP=1 <<'SQL'
              ALTER TABLE shipments ADD COLUMN IF NOT EXISTS carrier text;
              UPDATE shipments SET carrier = 'Harbourline Freight' WHERE carrier IS NULL;
              SQL
              echo "migration 001 applied"
