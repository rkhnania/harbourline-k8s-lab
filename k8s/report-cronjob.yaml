apiVersion: batch/v1
kind: CronJob
metadata:
  name: shipment-report
spec:
  schedule: "*/1 * * * *"
  timeZone: "Australia/Sydney"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          # postgres:16-alpine runs psql as uid 70 (the postgres user in that image).
          # Added 2026-10-20 after Trivy KSV-0118/0012/0104: these two workloads
          # predate the hardening applied to the Deployments and were never
          # revisited, so they were running with the default security context.
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: report
              image: postgres:16-alpine
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: harbourline-db-secret
                      key: DB_PASSWORD
              command:
                - sh
                - -c
                - |
                  echo "Shipment status report - $(date)"
                  psql -h harbourline-db -U postgres -t -c "SELECT status, count(*) FROM shipments GROUP BY status;"
