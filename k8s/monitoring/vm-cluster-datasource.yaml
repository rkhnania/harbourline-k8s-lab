# Adds the VM cluster's Prometheus to the KIND cluster's Grafana, so one Grafana
# shows both clusters.
#
#   kubectl --context kind-harbourline apply -f k8s/monitoring/vm-cluster-datasource.yaml
#
# Prerequisite on the VM cluster - Prometheus must be reachable off-cluster:
#   kubectl --context harbourline-vm -n monitoring patch svc \
#     kps-kube-prometheus-stack-prometheus -p '{"spec":{"type":"LoadBalancer"}}'
#
# The grafana_datasource label is what matters: the kube-prometheus-stack
# Grafana runs a sidecar that watches for ConfigMaps carrying it and loads them
# without editing Grafana config or restarting the pod.
#
# DIRECTION IS NOT A PREFERENCE. WSL2 is NAT'd: the kind cluster can reach
# 192.168.0.x, but nothing on the LAN can reach into WSL. So the hub must be the
# kind cluster. Verified before building on it, from inside a pod rather than
# from WSL - different network path, different answer:
#   kubectl --context kind-harbourline -n monitoring run netcheck --restart=Never \
#     --image=curlimages/curl:8.11.1 --command -- sh -c \
#     'curl -s -o /dev/null -w "%{http_code}\n" http://192.168.0.243:9090/-/healthy; sleep 2'
#
# LIMIT: this is two datasources, not federation. You pick a cluster per
# dashboard; no single query spans both, so "CPU across the whole estate" is not
# possible this way. That needs Thanos or Grafana Mimir - a layer above several
# Prometheus servers presenting one queryable endpoint. Two datasources is right
# at two clusters; Thanos is right at twenty.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vm-cluster-prometheus-datasource
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  vm-cluster-prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus-VM
        uid: prometheus-vm
        type: prometheus
        access: proxy
        # MetalLB assigns in creation order: .240 Longhorn, .241 Grafana,
        # .242 Argo CD, .243 Prometheus. Re-check after any reinstall.
        url: http://192.168.0.243:9090
        isDefault: false
        jsonData:
          timeInterval: 30s
