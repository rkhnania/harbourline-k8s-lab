# Adds the VM cluster's Prometheus to the KIND cluster's Grafana, so one Grafana
# shows both clusters. There is exactly ONE Grafana in this project; the VM
# cluster's duplicate was retired 2026-10-16 (see k8s/vm-cluster/kps-values.yaml).
#
#   kubectl --context kind-harbourline apply -f k8s/monitoring/vm-cluster-datasource.yaml
#   kubectl --context kind-harbourline -n monitoring rollout restart deploy/kps-grafana
#
# The grafana_datasource label is what matters: the kube-prometheus-stack Grafana
# runs a sidecar that watches for ConfigMaps carrying it and loads them without
# editing Grafana config.
#
# NAME, NOT ADDRESS - AND WHY THAT TOOK WORK.
# This used to point at http://192.168.0.243:9090, a MetalLB address created by
# an imperative `kubectl patch svc ... type=LoadBalancer`. That patch was never
# in Git, so the next `helm upgrade` of the kps release reverted the Service to
# ClusterIP and this datasource broke with "i/o timeout" - the address went dark
# with no warning and nothing to explain it. That happened on 2026-10-16.
#
# It now goes through Traefik on the VM cluster, by name. Which required
# teaching the name to TWO resolvers, because there are two kinds of client:
#   - browsers -> the Windows hosts file
#   - pods     -> the kind cluster's CoreDNS (k8s/kind/coredns.yaml)
# Grafana is a pod. It does not read your hosts file. A hostname is only
# canonical if the CLIENT can resolve it.
#
# DIRECTION IS NOT A PREFERENCE. WSL2 is NAT'd: the kind cluster can reach
# 192.168.0.x, but nothing on the LAN can reach into WSL. So the hub must be the
# kind cluster.
#
# tlsSkipVerify: the certificate is self-signed (one wildcard cert for
# *.hl.internal, held by Traefik's TLSStore). DEBT: replace with cert-manager
# and a local CA issuer, then drop this line.
#
# LIMIT: this is two datasources, not federation. You pick a cluster per
# dashboard; no single query spans both. That needs Thanos or Grafana Mimir.
# Two datasources is right at two clusters; Thanos is right at twenty.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vm-cluster-prometheus-datasource
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  vm-cluster-prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus-VM
        # UID is unchanged on purpose - dashboards reference it, and changing it
        # would silently orphan every panel pinned to this datasource.
        uid: prometheus-vm
        type: prometheus
        access: proxy
        url: https://prometheus.hl.internal
        isDefault: false
        jsonData:
          timeInterval: 30s
          tlsSkipVerify: true
