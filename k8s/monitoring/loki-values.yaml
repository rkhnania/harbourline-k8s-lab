# Loki 7.3.0 (app 3.6.x) in SingleBinary mode for the kind cluster.
#
# Differs from the chart's own single-binary-values.yaml in two ways that matter:
#   - filesystem storage instead of MinIO (one less pod and PVC for a lab)
#   - resources sized for kind; the chart example requests 2 CPU and 2Gi
#
# Install:
#   helm upgrade --install loki grafana/loki --version 7.3.0 \
#     -n monitoring -f k8s/monitoring/loki-values.yaml --wait --timeout 10m

deploymentMode: SingleBinary

loki:
  # Single tenant. With auth_enabled the X-Scope-OrgID header becomes mandatory
  # on every query, which Grafana then has to be configured to send.
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 168h
    allow_structured_metadata: true
  ingester:
    chunk_encoding: snappy
  querier:
    max_concurrent: 2

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
  persistence:
    enabled: true
    size: 5Gi

# No nginx gateway - Grafana talks to the loki Service on 3100 directly.
gateway:
  enabled: false

# Memcached tiers are pointless at this size and cost two more pods each.
chunksCache:
  enabled: false
resultsCache:
  enabled: false

minio:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false

# Zero out every other deployment mode's components. SingleBinary runs them all
# in one process; leaving these at their defaults starts a second copy of each.
backend: { replicas: 0 }
read: { replicas: 0 }
write: { replicas: 0 }
ingester: { replicas: 0 }
distributor: { replicas: 0 }
querier: { replicas: 0 }
queryFrontend: { replicas: 0 }
queryScheduler: { replicas: 0 }
indexGateway: { replicas: 0 }
compactor: { replicas: 0 }
bloomGateway: { replicas: 0 }
bloomPlanner: { replicas: 0 }
bloomBuilder: { replicas: 0 }
patternIngester: { replicas: 0 }
ruler: { replicas: 0 }
overridesExporter: { replicas: 0 }
