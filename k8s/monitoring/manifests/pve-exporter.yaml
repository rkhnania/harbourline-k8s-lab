# Proxmox VE -> Prometheus -> the ONE Grafana (grafana.localtest.me).
#
# WHY AN EXPORTER AND NOT A PUSH.
# Proxmox can push metrics natively, but only to Graphite or InfluxDB
# (Datacenter -> Metric Server). Prometheus is pull-based, so the shape of this
# integration is forced: something inside the cluster has to reach OUT to the
# Proxmox API and translate.
#
# WHY IT RUNS IN THE CLUSTER AND NOT ON pve1.
# WSL2 is NAT'd. The kind cluster can reach 192.168.0.x; nothing on the LAN can
# reach into WSL. Same constraint that decided vm-cluster-datasource.yaml. So the
# cluster is always the client, never the server. Put the exporter on pve1 and
# Prometheus could never scrape it.
#
# WHAT IT TALKS TO. The Proxmox API on 8006 over HTTPS, authenticated with an
# API TOKEN, not a password - a token is scoped to a role (PVEAuditor =
# read-only), can be revoked on its own, and never unlocks the web UI.
# Credentials come from the SealedSecret; nothing here holds one.
#
# ONE EXPORTER, MANY TARGETS. prometheus-pve-exporter is a multi-target
# exporter, like blackbox: the host to query is a QUERY PARAMETER, not config.
# The ServiceMonitor below supplies it. A second Proxmox node is a second
# endpoint entry, not a second Deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pve-exporter
  labels:
    app.kubernetes.io/name: pve-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pve-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pve-exporter
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          # PINNED DELIBERATELY. Verify the tag exists before Argo ever sees it:
          #   docker pull prompve/prometheus-pve-exporter:3.5.5
          image: prompve/prometheus-pve-exporter:3.5.5
          ports:
            - name: http
              containerPort: 9221
          # PVE_USER / PVE_TOKEN_NAME / PVE_TOKEN_VALUE / PVE_VERIFY_SSL.
          # Env-var config populates the exporter's "default" module, which is
          # what the ServiceMonitor scrapes when it passes no module= param.
          envFrom:
            - secretRef:
                name: pve-exporter-credentials
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # WHY /tmp NEEDS A VOLUME.
          # gunicorn's WorkerTmp calls tempfile.mkstemp() before it will spawn a
          # single worker. With readOnlyRootFilesystem: true there is nowhere to
          # write, and the process dies at startup with
          #   FileNotFoundError: No usable temporary directory found
          # It binds the port first, so the logs look like a healthy start.
          # The fix is NOT to relax the hardening. It is to give the one
          # directory that must be writable a volume of its own. medium: Memory
          # makes it a tmpfs, so nothing ever lands on a node disk.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 192Mi
          # tcpSocket, NOT httpGet. The exporter's HTTP paths are /pve and
          # /metrics; it has no documented health endpoint, and a probe against a
          # path that 404s would restart a working pod forever.
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: pve-exporter
  labels:
    app.kubernetes.io/name: pve-exporter
spec:
  selector:
    app.kubernetes.io/name: pve-exporter
  ports:
    - name: http
      port: 9221
      targetPort: http
---
# release: kps IS LOAD-BEARING.
# kube-prometheus-stack runs with serviceMonitorSelectorNilUsesHelmValues: true,
# so the Prometheus object only adopts ServiceMonitors labelled with its release
# name. Same trap as harbourline-alerts.yaml: without this label the object is
# accepted by the API server, shows Synced and Healthy in Argo, and is silently
# never scraped. "Valid" and "in effect" are different questions.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pve-exporter
  labels:
    release: kps
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: pve-exporter
  endpoints:
    - port: http
      path: /pve
      interval: 60s
      # 30s, not the 10s default. The exporter makes several serial API calls per
      # scrape; on a nested host under load that can exceed 10s, and a timeout
      # looks identical to a dead target.
      scrapeTimeout: 30s
      params:
        target:
          - "192.168.0.50"
        cluster:
          - "1"
        node:
          - "1"
      # Without this every series is labelled instance=pve-exporter:9221 - the
      # EXPORTER, not the host it described. With ten Proxmox nodes behind one
      # exporter, that makes the metrics useless. Promote the param instead.
      relabelings:
        - sourceLabels: [__param_target]
          targetLabel: instance
