# Dedicated subjects for the two workloads in k8s/base. Neither calls the
# Kubernetes API, and neither is granted a single permission - the point is
# that `default` cannot be scoped. A Role bound to `default` for one workload
# is inherited by every pod in the namespace that does not name a
# ServiceAccount, this database included.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: harbourline-db
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: harbourline-db-init
automountServiceAccountToken: false
