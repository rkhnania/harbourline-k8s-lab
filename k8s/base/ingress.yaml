apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: harbourline
spec:
  ingressClassName: nginx
  rules:
    - host: harbourline.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: harbourline-web
                port:
                  number: 80
