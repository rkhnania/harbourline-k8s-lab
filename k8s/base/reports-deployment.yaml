apiVersion: apps/v1
kind: Deployment
metadata:
  name: harbourline-reports
spec:
  replicas: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 0
  selector:
    matchLabels:
      app: harbourline-reports
  template:
    metadata:
      labels:
        app: harbourline-reports
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: reports
          image: harbourline/reports
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: harbourline-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: harbourline-db-secret
                  key: DB_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
