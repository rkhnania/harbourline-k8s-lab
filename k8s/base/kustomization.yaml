apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: harbourline

resources:
- configmap.yaml
- db-deployment.yaml
- db-init-job.yaml
- api-deployment.yaml
- api-service.yaml
- web-deployment.yaml
- ingress.yaml

images:
- name: harbourline/api
  newName: ghcr.io/rkhnania/harbourline-api
  newTag: 6c93d18
- name: harbourline/web
  newName: ghcr.io/rkhnania/harbourline-web
  newTag: 6c93d18

labels:
- pairs:
    app.kubernetes.io/part-of: harbourline
