apiVersion: apps/v1
kind: Deployment
metadata:
  name: harbourline-api
  labels:
    app: harbourline-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: harbourline-api
  template:
    metadata:
      labels:
        app: harbourline-api
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: api
          image: harbourline/api:v9
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: harbourline-config
            - secretRef:
                name: harbourline-db-secret
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            failureThreshold: 2
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 3
            failureThreshold: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
