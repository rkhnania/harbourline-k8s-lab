name: CI

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'web/**'
      - 'reports/**'
      - '.github/workflows/ci.yaml'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # web is nginx serving static files - nothing to unit test.
        component: [api, reports]

    # A real Postgres, not a mock. GitHub starts this container alongside the
    # job and maps its port onto the runner's localhost. Same shape as running
    # it on a docker network locally, which is how the suite was developed.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Without a health check the job races the database: Postgres accepts
        # TCP a moment before it will accept queries, so the first test can
        # fail on timing alone. pg_isready is the real readiness signal.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches python:3.12-slim in the Dockerfiles. Test on the runtime
          # you ship: the dependencies are pinned against 3.12, and a failure
          # caused by a different interpreter tells you nothing about the code.
          python-version: '3.12'

      - name: Install ${{ matrix.component }} dependencies
        working-directory: ./${{ matrix.component }}
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run ${{ matrix.component }} tests
        working-directory: ./${{ matrix.component }}
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PASSWORD: postgres
        run: >-
          python -m pytest -v
          --junitxml=test-results.xml
          --cov=app --cov-report=xml --cov-report=term

      - name: Upload test results and coverage
        # if: always() - without it this step is skipped when the tests fail,
        # which is precisely when the report is worth having.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.component }}
          path: |
            ${{ matrix.component }}/test-results.xml
            ${{ matrix.component }}/coverage.xml
          retention-days: 30

  build:
    # Nothing is built until the tests pass. This is the gate: a failing test
    # now stops an image from ever being produced, rather than being noticed
    # after it is deployed.
    needs: [test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [api, web, reports]
    steps:
      - uses: actions/checkout@v4

      - name: Set tag and image name
        run: |
          echo "TAG=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${{ github.repository_owner }}/harbourline-${{ matrix.component }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.component }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          load: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}

      - name: Scan ${{ matrix.component }} with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.TAG }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Push ${{ matrix.component }}
        run: docker push "${IMAGE}:${TAG}"

  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan (dependencies and secrets)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Trivy config scan (Dockerfiles and Kubernetes manifests)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '0'

  deploy:
    needs: [build, scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set tag
        run: echo "TAG=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Update image tags in the Helm values
        run: |
          for svc in api web reports; do
            sed -i "s|^  tag: .*|  tag: \"${TAG}\"|" helm/harbourline/values-$svc.yaml
          done
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/harbourline/values-api.yaml helm/harbourline/values-web.yaml helm/harbourline/values-reports.yaml
          git commit -m "ci: deploy harbourline api+web+reports:${TAG}" || echo "no manifest change"
          git push
