name: CI

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'web/**'
      - 'reports/**'
      - '.github/workflows/ci.yaml'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [api, web, reports]
    steps:
      - uses: actions/checkout@v4

      - name: Set tag and image name
        run: |
          echo "TAG=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${{ github.repository_owner }}/harbourline-${{ matrix.component }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.component }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          load: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}

      - name: Scan ${{ matrix.component }} with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.TAG }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Push ${{ matrix.component }}
        run: docker push "${IMAGE}:${TAG}"

  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan (dependencies and secrets)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Trivy config scan (Dockerfiles and Kubernetes manifests)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '0'

  deploy:
    needs: [build, scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set tag
        run: echo "TAG=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Update image tags in the manifest
        run: |
          curl -sfL https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh | bash
          sudo mv kustomize /usr/local/bin/
          OWNER=${{ github.repository_owner }}
          cd k8s/base
          kustomize edit set image harbourline/api=ghcr.io/${OWNER}/harbourline-api:${TAG}
          kustomize edit set image harbourline/web=ghcr.io/${OWNER}/harbourline-web:${TAG}
          kustomize edit set image harbourline/reports=ghcr.io/${OWNER}/harbourline-reports:${TAG}
          cd -
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/base/kustomization.yaml
          git commit -m "ci: deploy harbourline api+web+reports:${TAG}" || echo "no manifest change"
          git push
