server {
    listen 8080;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    location /api/ {
        proxy_pass http://harbourline-api:8080/;
    }

    # Insight, proxied under the same origin as the portal.
    #
    # WHY PROXY RATHER THAN CALL IT DIRECTLY FROM THE BROWSER: the reports
    # Service is cluster-internal, so a browser cannot resolve it. Exposing it
    # through a second Ingress would work and would also mean a second origin,
    # a CORS policy to maintain, and a second thing to authenticate later.
    # One origin, two upstreams.
    #
    # The trailing slash on proxy_pass matters: without it nginx forwards the
    # full /reports/... path AND appends it to the upstream path, producing
    # /reports/reports/summary. The classic nginx foot-gun.
    location /reports/ {
        proxy_pass http://harbourline-reports:8080/reports/;
    }
}
