<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plimsoll — Harbourline Logistics</title>
<style>
  :root{
    --bg:#0f1419; --panel:#161c23; --line:#232c36; --fg:#dde5ec; --dim:#8a97a4;
    --accent:#3fb6a8; --warn:#d9a441; --bad:#d9534f; --good:#5aa469;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:light){
    :root{--bg:#f4f6f8;--panel:#fff;--line:#dde3e9;--fg:#1b2730;--dim:#5e6e7c;}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header{display:flex;flex-wrap:wrap;gap:16px;align-items:center;
         padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
  .brand{font-weight:700;letter-spacing:.14em;font-size:19px}
  .brand span{color:var(--accent)}
  .sub{color:var(--dim);font-size:13px}
  .spacer{flex:1}
  .chip{font-family:var(--mono);font-size:12px;color:var(--dim);
        border:1px solid var(--line);border-radius:999px;padding:3px 10px}
  .chip b{color:var(--fg);font-weight:600}
  .badge{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.06em;
         border-radius:999px;padding:4px 12px}
  .ok{background:rgba(90,164,105,.15);color:var(--good);border:1px solid var(--good)}
  .no{background:rgba(217,83,79,.15);color:var(--bad);border:1px solid var(--bad)}
  input{background:var(--bg);color:var(--fg);border:1px solid var(--line);
        border-radius:6px;padding:5px 9px;font:inherit;font-family:var(--mono);font-size:13px}
  nav{display:flex;gap:2px;padding:0 20px;border-bottom:1px solid var(--line);
      background:var(--panel);overflow-x:auto}
  nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--dim);
             padding:11px 15px;font:inherit;cursor:pointer;white-space:nowrap}
  nav button[aria-selected=true]{color:var(--fg);border-bottom-color:var(--accent)}
  main{padding:20px;max-width:1200px}
  h2{font-size:14px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);
     margin:0 0 10px}
  .cards{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:20px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
        padding:12px 16px;min-width:120px}
  .card .n{font-family:var(--mono);font-size:24px;font-weight:600}
  .card .l{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
  table{width:100%;border-collapse:collapse;background:var(--panel);
        border:1px solid var(--line);border-radius:10px;overflow:hidden}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.08em;
     color:var(--dim);padding:9px 12px;border-bottom:1px solid var(--line);font-weight:600}
  td{padding:9px 12px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:13px}
  tr:last-child td{border-bottom:0}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .muted{color:var(--dim)}
  button.act{background:var(--accent);color:#06211f;border:0;border-radius:6px;
             padding:5px 11px;font:inherit;font-size:12px;font-weight:600;cursor:pointer}
  button.act.ghost{background:none;color:var(--accent);border:1px solid var(--accent)}
  button.act:disabled{opacity:.4;cursor:not-allowed}
  .flash{margin-bottom:14px;padding:10px 14px;border-radius:8px;font-family:var(--mono);
         font-size:13px;display:none}
  .flash.show{display:block}
  .flash.good{background:rgba(90,164,105,.14);border:1px solid var(--good);color:var(--good)}
  .flash.bad{background:rgba(217,83,79,.14);border:1px solid var(--bad);color:var(--bad)}
  .wrap{overflow-x:auto}
  .z{display:inline-block;font-size:11px;padding:1px 7px;border-radius:4px;
     border:1px solid var(--line);color:var(--dim)}
  footer{padding:16px 20px;color:var(--dim);font-size:12px;border-top:1px solid var(--line)}
</style>
</head>
<body>

<header>
  <div>
    <div class="brand">PLIM<span>SOLL</span></div>
    <div class="sub">Harbourline Logistics — warehouse management</div>
  </div>
  <div class="spacer"></div>
  <label class="chip">operator <input id="operator" size="10" value="portal"></label>
  <span class="chip">core <b id="core-host">—</b></span>
  <span class="chip">on hand <b id="on-hand">—</b></span>
  <span id="verdict" class="badge">CHECKING</span>
</header>

<nav id="tabs">
  <button data-tab="stock"   aria-selected="true">Stock</button>
  <button data-tab="inbound" aria-selected="false">Inbound</button>
  <button data-tab="outbound" aria-selected="false">Outbound</button>
  <button data-tab="ledger"  aria-selected="false">Ledger</button>
  <button data-tab="audit"   aria-selected="false">Audit</button>
</nav>

<main>
  <div id="flash" class="flash"></div>
  <section id="panel"></section>
</main>

<footer>
  Portal proxies Core at <code>/api/</code> and Insight at <code>/reports/</code>.
  Every movement is written to the ledger with the operator named above.
</footer>

<script>
// Plimsoll Portal.
//
// No framework and no build step on purpose: this tier is nginx serving one
// static file, and adding a toolchain would mean a build stage, a lockfile and
// a supply chain for a page that renders six tables.
//
// Everything is same-origin. nginx proxies Core at /api/ and Insight at
// /reports/, so there is no CORS policy to maintain and no second Ingress to
// authenticate later.

const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"]/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

function flash(msg, good) {
  const el = $("#flash");
  el.textContent = msg;
  el.className = "flash show " + (good ? "good" : "bad");
  clearTimeout(flash._t);
  flash._t = setTimeout(() => el.className = "flash", 6000);
}

async function get(path) {
  const r = await fetch(path, { headers: { "Accept": "application/json" } });
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.error || `${path} returned ${r.status}`);
  return body;
}

// Core answers a refused movement with 409 and a body explaining WHY -
// insufficient stock, over-receipt, order not picked. Showing that text is the
// difference between an operator who knows what to do next and one who does
// not. "Request failed" is never shown if Core said something better.
async function post(path, payload) {
  const r = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ ...payload, actor: `portal/${$("#operator").value || "anon"}` }),
  });
  const body = await r.json().catch(() => ({}));
  if (!r.ok) {
    const why = body.error || `HTTP ${r.status}`;
    throw new Error(body.constraint ? `${why} (${body.constraint})` : why);
  }
  return body;
}

const rows = (arr, cells) => arr.map(cells).join("") ||
  `<tr><td class="muted" colspan="9">nothing to show</td></tr>`;

// ------------------------------------------------------------------ panels

const panels = {
  async stock() {
    const [s, byZone] = await Promise.all([get("/api/stock"), get("/reports/stock")]);
    const zones = Object.entries(byZone.by_zone || {});
    return `
      <div class="cards">
        ${zones.map(([z, q]) => `
          <div class="card"><div class="n">${q}</div><div class="l">${esc(z)}</div></div>`).join("")}
        <div class="card"><div class="n">${s.on_hand}</div><div class="l">on hand</div></div>
      </div>
      <h2>Stock by location</h2>
      <div class="wrap"><table>
        <tr><th>SKU</th><th>Location</th><th>Zone</th><th class="num">Qty</th><th></th></tr>
        ${rows(s.lines, r => `<tr>
          <td>${esc(r.sku)}</td><td>${esc(r.location)}</td>
          <td><span class="z">${esc(r.zone)}</span></td>
          <td class="num">${r.qty}</td>
          <td><button class="act ghost" data-move="${esc(r.sku)}|${esc(r.location)}">Move</button></td>
        </tr>`)}
      </table></div>`;
  },

  async inbound() {
    const receipts = await get("/api/receipts");
    const detail = await Promise.all(receipts.map(r => get(`/api/receipts/${r.id}`)));
    return `
      <h2>Inbound loads</h2>
      ${detail.map(r => `
        <div style="margin-bottom:18px">
          <div class="cards" style="margin-bottom:8px">
            <div class="card">
              <div class="n">${esc(r.id)}</div>
              <div class="l">${esc(r.carrier)} — ${esc(r.status)}</div>
            </div>
          </div>
          <div class="wrap"><table>
            <tr><th>Line</th><th>SKU</th><th class="num">Expected</th>
                <th class="num">Received</th><th>Receive</th></tr>
            ${rows(r.lines, l => {
              const left = l.qty_expected - l.qty_received;
              return `<tr>
                <td>${l.line_no}</td><td>${esc(l.sku)}</td>
                <td class="num">${l.qty_expected}</td>
                <td class="num">${l.qty_received}</td>
                <td>
                  <input size="4" value="${left}" id="rq-${esc(r.id)}-${l.line_no}" ${left ? "" : "disabled"}>
                  <button class="act" data-receive="${esc(r.id)}|${l.line_no}" ${left ? "" : "disabled"}>Receive</button>
                </td></tr>`;
            })}
          </table></div>
        </div>`).join("") || `<p class="muted">No inbound loads.</p>`}`;
  },

  async outbound() {
    const orders = await get("/api/orders");
    const detail = await Promise.all(orders.map(o => get(`/api/orders/${o.id}`)));
    return `
      <h2>Orders</h2>
      ${detail.map(o => `
        <div style="margin-bottom:18px">
          <div class="cards" style="margin-bottom:8px">
            <div class="card">
              <div class="n">${esc(o.id)}</div>
              <div class="l">${esc(o.customer)} — ${esc(o.status)}</div>
            </div>
            <div class="card" style="display:flex;align-items:center">
              <button class="act" data-dispatch="${esc(o.id)}"
                ${o.status === "PICKED" ? "" : "disabled"}>Dispatch</button>
            </div>
          </div>
          <div class="wrap"><table>
            <tr><th>Line</th><th>SKU</th><th class="num">Ordered</th>
                <th class="num">Picked</th><th>Pick</th></tr>
            ${rows(o.lines, l => {
              const left = l.qty - l.qty_picked;
              return `<tr>
                <td>${l.line_no}</td><td>${esc(l.sku)}</td>
                <td class="num">${l.qty}</td><td class="num">${l.qty_picked}</td>
                <td>
                  <input size="4" value="${left}" id="pq-${esc(o.id)}-${l.line_no}" ${left ? "" : "disabled"}>
                  <button class="act" data-pick="${esc(o.id)}|${l.line_no}" ${left ? "" : "disabled"}>Pick</button>
                </td></tr>`;
            })}
          </table></div>
        </div>`).join("") || `<p class="muted">No orders.</p>`}`;
  },

  async ledger() {
    const m = await get("/api/movements?limit=100");
    return `
      <h2>Movement ledger — append only</h2>
      <div class="wrap"><table>
        <tr><th>#</th><th>When</th><th>SKU</th><th>From</th><th>To</th>
            <th class="num">Qty</th><th>Reason</th><th>Actor</th></tr>
        ${rows(m, r => `<tr>
          <td>${r.id}</td>
          <td class="muted">${esc(String(r.occurred_at).replace("T", " ").slice(0, 19))}</td>
          <td>${esc(r.sku)}</td>
          <td>${esc(r.from_location) || '<span class="muted">—</span>'}</td>
          <td>${esc(r.to_location) || '<span class="muted">—</span>'}</td>
          <td class="num">${r.qty}</td>
          <td><span class="z">${esc(r.reason)}</span></td>
          <td class="muted">${esc(r.actor)}</td>
        </tr>`)}
      </table></div>`;
  },

  async audit() {
    const [rec, open] = await Promise.all([
      get("/reports/reconciliation"), get("/reports/open-orders")]);
    return `
      <h2>Ledger vs balance</h2>
      <div class="cards">
        <div class="card">
          <div class="n" style="color:${rec.balanced ? "var(--good)" : "var(--bad)"}">
            ${esc(rec.verdict)}</div>
          <div class="l">${rec.discrepancy_count} discrepancies</div>
        </div>
      </div>
      <p class="muted" style="max-width:62ch">
        Stock is re-derived from the movement ledger and compared to the balance
        table. They must agree: every change writes both inside one transaction.
        A difference means something wrote to stock without a movement.
      </p>
      ${rec.discrepancies.length ? `<div class="wrap"><table>
        <tr><th>SKU</th><th>Location</th><th class="num">Balance</th>
            <th class="num">Ledger</th><th class="num">Diff</th></tr>
        ${rows(rec.discrepancies, d => `<tr>
          <td>${esc(d.sku)}</td><td>${esc(d.location)}</td>
          <td class="num">${d.balance}</td><td class="num">${d.ledger}</td>
          <td class="num" style="color:var(--bad)">${d.difference}</td></tr>`)}
      </table></div>` : ""}
      <h2 style="margin-top:24px">Open orders</h2>
      <div class="wrap"><table>
        <tr><th>Order</th><th>Customer</th><th>Status</th>
            <th class="num">Ordered</th><th class="num">Picked</th><th class="num">Fill</th></tr>
        ${rows(open.open_orders, o => `<tr>
          <td>${esc(o.id)}</td><td>${esc(o.customer)}</td>
          <td><span class="z">${esc(o.status)}</span></td>
          <td class="num">${o.ordered}</td><td class="num">${o.picked}</td>
          <td class="num">${Math.round(o.fill_rate * 100)}%</td></tr>`)}
      </table></div>`;
  },
};

// ------------------------------------------------------------------ driving

let current = "stock";

async function render() {
  try {
    $("#panel").innerHTML = await panels[current]();
  } catch (e) {
    $("#panel").innerHTML = `<p class="muted">${esc(e.message)}</p>`;
    flash(e.message, false);
  }
  refreshHeader();
}

async function refreshHeader() {
  try {
    const [h, s, r] = await Promise.all([
      get("/api/health"), get("/api/stock"), get("/reports/reconciliation")]);
    $("#core-host").textContent = h.host;
    $("#on-hand").textContent = s.on_hand;
    const v = $("#verdict");
    v.textContent = r.verdict;
    v.className = "badge " + (r.balanced ? "ok" : "no");
  } catch (e) {
    $("#verdict").textContent = "UNREACHABLE";
    $("#verdict").className = "badge no";
  }
}

$("#tabs").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-tab]");
  if (!b) return;
  [...document.querySelectorAll("#tabs button")]
    .forEach(x => x.setAttribute("aria-selected", String(x === b)));
  current = b.dataset.tab;
  render();
});

document.addEventListener("click", async (e) => {
  const b = e.target.closest("button[data-receive],button[data-pick],button[data-dispatch],button[data-move]");
  if (!b) return;
  b.disabled = true;
  try {
    if (b.dataset.receive) {
      const [id, line] = b.dataset.receive.split("|");
      const qty = parseInt($(`#rq-${id}-${line}`).value, 10);
      const res = await post(`/api/receipts/${id}/receive`, { line_no: +line, qty });
      flash(`Received ${res.received} ${res.sku} into ${res.into}`, true);
    } else if (b.dataset.pick) {
      const [id, line] = b.dataset.pick.split("|");
      const qty = parseInt($(`#pq-${id}-${line}`).value, 10);
      const res = await post(`/api/orders/${id}/pick`, { line_no: +line, qty });
      const from = res.allocation.map(a => `${a.location}×${a.qty}`).join(", ");
      flash(`Picked ${res.picked} ${res.sku} from ${from} — order ${res.order_status}`, true);
    } else if (b.dataset.dispatch) {
      const res = await post(`/api/orders/${b.dataset.dispatch}/dispatch`, {});
      flash(`Dispatched ${res.dispatched} as ${res.shipment}`, true);
    } else if (b.dataset.move) {
      const [sku, from] = b.dataset.move.split("|");
      const to = prompt(`Move ${sku} from ${from} — destination location?`);
      if (!to) { b.disabled = false; return; }
      const qty = parseInt(prompt("Quantity?") || "0", 10);
      if (!qty) { b.disabled = false; return; }
      const res = await post("/api/putaway", { sku, from, to, qty });
      flash(`Moved ${res.moved} ${res.sku} ${res.from} → ${res.to}`, true);
    }
  } catch (err) {
    flash(err.message, false);
  }
  render();
});

render();
setInterval(refreshHeader, 15000);
</script>
</body>
</html>
